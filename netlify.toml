[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/past-results"
  to = "/results"
  status = 301

# SPA fallback — prerendered route folders take precedence when present
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
